<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 6 - Vendas e Comissoes</title>
    <link rel="stylesheet" href="../style/ex6.css">
</head>

<body>
    <header>
        <a href="../index.html">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="e6e6e6">
                <path
                    d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z" />
            </svg>
        </a>
        <h1>Vendas e Comissoes</h1>
    </header>
    <main>
        <form id="formConfig">
            <input type="number" name="metaMensal" id="metaMensal" placeholder="Meta mensal de vendas por vendedor (R$)"
                min="0" step="0.01">
            <input type="number" name="percentualBase" id="percentualBase"
                placeholder="Percentual base de comissao (ex: 5)" min="0" step="0.01">
            <input type="submit" value="Confirmar Configuracao">
        </form>

        <form id="formVenda" class="oculto">
            <input type="text" name="codigoVenda" id="codigoVenda" placeholder="Codigo da venda (unico)">
            <input type="text" name="codigoVendedor" id="codigoVendedor" placeholder="Codigo do vendedor">
            <select name="regiao" id="regiao">
                <option value="">Selecione a regiao da loja</option>
                <option value="1">1 - Norte</option>
                <option value="2">2 - Nordeste</option>
                <option value="3">3 - Sudeste</option>
                <option value="4">4 - Sul</option>
            </select>
            <input type="number" name="valorVenda" id="valorVenda" placeholder="Valor da venda (R$)" min="0"
                step="0.01">
            <select name="tipoCliente" id="tipoCliente">
                <option value="">Selecione o tipo de cliente</option>
                <option value="PF">PF - Pessoa Fisica</option>
                <option value="PJ">PJ - Pessoa Juridica</option>
            </select>
            <input type="submit" value="Cadastrar Venda">
            <input type="button" value="Relatorio" onclick="gerarRelatorio()">
        </form>

        <div class="vendas"></div>
        <div class="relatorio"></div>
    </main>
    <script src="../scripts/ex6.js"></script>
</body>

</html>
