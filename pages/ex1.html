<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
    <link rel="stylesheet" href="../style/ex1.css">
</head>

<body>
    <header>
        <a href="../index.html">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="e6e6e6">
                <path
                    d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z" />
            </svg>
        </a>
        <h1>Transportadora</h1>
    </header>
    <main>
        <form>
            <input type="text" name="pedido" id="pedido" placeholder="Digite o número do pedido">
            <input type="number" name="regiao" id="regiao" placeholder="Digite o código da região (1,2,3)">
            <input type="text" name="distancia" id="distancia" placeholder="Digite a distância (km)">
            <input type="number" name="pecas" id="pecas" placeholder="Digite a quantidade de peças" min="1">
            <input type="text" name="litro" id="litro" placeholder="Digite o valor do combustível">
            <label for="rastreamento">Ativar rastreamento?
                <input type="checkbox" name="rastreamento" id="rastreamento">
            </label>
            <input type="submit" value="Calcular">
            <input type="button" value="Relatório" onclick="gerarRelatorio()">
        </form>
        <div class="pedidos"></div>
    </main>
    <script src="../scripts/ex1.js"></script>
</body>

</html>
